<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4b2f39">
  <title>HairsByGiftee — Owner Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=owner-20260923-7">
</head>
<body class="admin-body">
  <section id="loginView" class="login-view">
    <form id="loginForm" class="login-card" novalidate>
      <div class="logo"><span>HairsByGiftee</span><small>OWNER PORTAL</small></div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage the live website.</p>

      <label class="field">Email
        <input id="email" type="email" value="hairsbygifty@gmail.com" readonly>
      </label>

      <label class="field">Password
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password">
          <button id="togglePassword" class="password-toggle" type="button">Show</button>
        </div>
      </label>

      <button id="signInBtn" class="btn primary" type="submit">Sign in</button>
      <button id="resetBtn" class="text-btn" type="button">Forgot password?</button>

      <p id="message" class="form-error" hidden></p>
      <p id="success" class="form-success" hidden></p>
      <a class="preview-link" href="../">← Back to website</a>
    </form>
  </section>

  <div id="adminView" class="admin-wrap" hidden>
    <aside class="side">
      <div class="logo"><span>HairsByGiftee</span><small>OWNER</small></div>
      <button data-tab="home" class="active">Home</button>
      <button data-tab="products">Products</button>
      <button data-tab="deals">Hot Deals</button>
      <button data-tab="announcements">Announcements</button>
      <button data-tab="reviews">Reviews</button>
      <a href="../" target="_blank">View Website ↗</a>
      <button id="logoutBtn">Log out</button>
    </aside>
    <main class="admin-main">
      <div class="admin-top"><span class="preview-link">Live website controls</span><span id="ownerEmail"></span></div>
      <div id="screen"><div class="panel"><b>Loading dashboard…</b></div></div>
    </main>
  </div>

<script>
(function(){
  const API_KEY="AIzaSyDpRFnf0iE_C-ft0-H1Fm79OXUmsIv1HUk";
  const EMAIL="hairsbygifty@gmail.com";
  const loginView=document.getElementById("loginView");
  const adminView=document.getElementById("adminView");
  const form=document.getElementById("loginForm");
  const password=document.getElementById("password");
  const toggle=document.getElementById("togglePassword");
  const button=document.getElementById("signInBtn");
  const reset=document.getElementById("resetBtn");
  const message=document.getElementById("message");
  const success=document.getElementById("success");
  let dashboardLoaded=false;

  function showError(text){
    success.hidden=true;
    message.textContent=text;
    message.hidden=false;
  }
  function showSuccess(text){
    message.hidden=true;
    success.textContent=text;
    success.hidden=false;
  }
  function openDashboard(){
    loginView.hidden=true;
    adminView.hidden=false;
    document.getElementById("ownerEmail").textContent=sessionStorage.getItem("hbg_email")||EMAIL;
    if(!dashboardLoaded){
      dashboardLoaded=true;
      const s=document.createElement("script");
      s.src="./dashboard.js?v=owner-20260923-7";
      s.onerror=function(){
        document.getElementById("screen").innerHTML='<div class="panel"><b>Dashboard script failed to load.</b><p class="muted">Please refresh this page once.</p></div>';
      };
      document.body.appendChild(s);
    }
  }

  toggle.addEventListener("click",function(){
    const visible=password.type==="text";
    password.type=visible?"password":"text";
    toggle.textContent=visible?"Show":"Hide";
  });

  reset.addEventListener("click",async function(){
    message.hidden=true; success.hidden=true;
    reset.disabled=true; reset.textContent="Sending…";
    try{
      const res=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key="+API_KEY,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({requestType:"PASSWORD_RESET",email:EMAIL})
      });
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error((data.error&&data.error.message)||("HTTP "+res.status));
      showSuccess("Password reset email sent to "+EMAIL+".");
    }catch(err){
      showError("Could not send reset email: "+err.message);
    }finally{
      reset.disabled=false; reset.textContent="Forgot password?";
    }
  });

  form.addEventListener("submit",async function(e){
    e.preventDefault();
    message.hidden=true; success.hidden=true;
    if(!password.value){ showError("Enter the password first."); return; }

    button.disabled=true;
    button.textContent="Signing in…";

    try{
      const res=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+API_KEY,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({email:EMAIL,password:password.value,returnSecureToken:true})
      });
      const data=await res.json().catch(()=>({}));
      if(!res.ok){
        const code=(data.error&&data.error.message)||("HTTP "+res.status);
        const friendly={
          INVALID_LOGIN_CREDENTIALS:"The password is not accepted. Use “Forgot password?” to reset it.",
          INVALID_PASSWORD:"The password is incorrect.",
          EMAIL_NOT_FOUND:"The owner account was not found in Firebase Authentication.",
          OPERATION_NOT_ALLOWED:"Email/Password sign-in is not enabled in Firebase Authentication.",
          TOO_MANY_ATTEMPTS_TRY_LATER:"Too many attempts. Wait a few minutes, then try again."
        };
        throw new Error(friendly[code]||code);
      }

      sessionStorage.setItem("hbg_id_token",data.idToken);
      sessionStorage.setItem("hbg_refresh_token",data.refreshToken||"");
      sessionStorage.setItem("hbg_email",data.email||EMAIL);
      openDashboard();
    }catch(err){
      showError(err.message||"Sign in failed.");
      button.disabled=false;
      button.textContent="Sign in";
    }
  });

  if(sessionStorage.getItem("hbg_id_token")) openDashboard();
})();
</script>
</body>
</html>
