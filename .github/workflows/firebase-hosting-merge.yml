name: Deploy Firebase

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAIRSBYGIFTEE }}

      - name: Deploy Hosting, Firestore rules and Storage rules
        run: npx --yes firebase-tools@latest deploy --project hairsbygiftee --only hosting,firestore:rules,storage
